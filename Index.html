<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Trading Max</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#07111d;--panel:#0d1927;--panel2:#101f30;--line:#22354a;--text:#eef5ff;--muted:#8ea1b6;--blue:#4da3ff;--green:#5ee58a;--amber:#ffc24b;--red:#ff625f;--violet:#bd7cff;--cyan:#45d4e8}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#06101a,#08131f 46%,#07111d);color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1500px;margin:auto;padding:22px}.top{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.title h1{font-size:28px;margin:0 0 4px}.title p{margin:0;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,.fileLabel{border:1px solid #315579;background:#10243a;color:white;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.fileLabel input{display:none}.btn.secondary{background:#0d1927}.status{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin:6px 0 16px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0b1826;color:#bcd0e5;padding:9px 14px;border-radius:999px;cursor:pointer}.tab.active{background:#173555;color:#fff;border-color:#3a78b7}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(180deg,rgba(17,33,50,.98),rgba(11,23,36,.98));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.summary{grid-column:span 4}.wide{grid-column:span 8}.full{grid-column:1/-1}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:18px}.card h3{font-size:14px;color:#c7d5e4;text-transform:uppercase;letter-spacing:.06em}
.monthHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{padding:4px 8px;border-radius:999px;background:#10243a;color:#9fc8f0;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#0a1724;border:1px solid #1d3146;border-radius:10px;padding:10px}.metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:22px;font-weight:760;margin-top:2px}.metric .sub{font-size:11px;color:#748ba2;margin-top:2px}.good{color:var(--green)!important}.bad{color:var(--red)!important}.warn{color:var(--amber)!important}.blue{color:var(--blue)!important}.violet{color:var(--violet)!important}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#0a1724;border:1px solid #24405a;color:#b8cadc;font-size:13px}.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:120px 1fr 75px;gap:10px;align-items:center}.track{height:12px;background:#0b1622;border-radius:999px;overflow:hidden;border:1px solid #1b2c3e}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#2d78c7,#61b1ff)}.fill.green{background:linear-gradient(90deg,#19894d,#5ee58a)}.fill.violet{background:linear-gradient(90deg,#6f48a8,#bd7cff)}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:760px;background:#0a1724}th,td{padding:9px 10px;border-bottom:1px solid #1c2d40;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#102033;color:#c9d8e7;font-size:12px}td{font-size:13px}.muted{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:#aabdd0;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.footer{color:#71869c;font-size:12px;margin-top:14px}
@media(max-width:1000px){.summary,.wide{grid-column:span 6}}@media(max-width:680px){.app{padding:14px}.summary,.wide{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:84px 1fr 64px}.title h1{font-size:23px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="title"><h1>Dashboard Trading</h1><p>Diario operativo · caricamento locale del file Excel</p></div>
    <div class="actions">
      <label class="fileLabel">Carica diario .xlsx<input id="fileInput" type="file" accept=".xlsx,.xls"></label>
      <button class="btn secondary" id="resetBtn" type="button">Dati demo</button>
      <span class="status" id="status">Pronta</span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="dashboard"></div>
  <div class="footer">Calcolo locale nel browser. Il file selezionato non viene inviato da questa pagina. M1 resta storico/eterogeneo; il netto metodologico viene applicato da M2 in poi.</div>
</div>
<script>
const DEMO={
 M1:{name:'M1',total:22,operative:6,methodological:16,hit1:17,hit2:11,hit3:6,gross:157.46,net:null,drawdown:null,tp1:4.01,tp2:6.81,tp3:9.32,prof:0,best_asset:'FET',best_dir:'SHORT',best_mfe:21.29,best_tp:'TP6'},
 M2:{name:'M2',total:14,operative:8,methodological:6,hit1:11,hit2:8,hit3:7,gross:166.60,net:127.59,drawdown:-7.84,tp1:3.37,tp2:5.94,tp3:9.75,prof:3,best_asset:'ETH',best_dir:'LONG',best_mfe:63.67,best_tp:'OLTRE TP8'},
 M3:{name:'M3',total:3,operative:3,methodological:0,hit1:3,hit2:2,hit3:1,gross:52.94,net:43.49,drawdown:-2.45,tp1:3.50,tp2:5.88,tp3:10.48,prof:1,best_asset:'SOL',best_dir:'LONG',best_mfe:45.94,best_tp:'TP8'}
};
let state={months:structuredClone(DEMO),rows:{},selected:'overview',source:'demo'};
const $=s=>document.querySelector(s), dash=$('#dashboard'), tabs=$('#tabs'), statusEl=$('#status');
function pct(v){return v==null?'—':`${Number(v).toFixed(2).replace('.',',')}%`}
function rate(n,d){return d?`${n}/${d} · ${(100*n/d).toFixed(1).replace('.',',')}%`:'—'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parsePct(x){if(x==null)return null;let s=String(x).replace(',','.');let range=s.match(/(?:^|\s)([+]?\d+(?:\.\d+)?)\s*[-–]\s*([+]?\d+(?:\.\d+)?)\s*%/);if(range)return Number(range[1]);let m=s.match(/([+-]?\d+(?:\.\d+)?)\s*%/);return m?Number(m[1]):null}
function tpLevel(x){let s=String(x??'').toUpperCase();if(s.includes('OLTRE_TP8'))return 8;let best=0,re=/TP([1-9])/g,m;while((m=re.exec(s))){let a=Math.max(0,m.index-18),b=Math.min(s.length,re.lastIndex+28),ctx=s.slice(a,b);if(/SFIORAT|QUASI|NON RAGGIUNT|NESSUNO|POTENZIALE/.test(ctx))continue;best=Math.max(best,Number(m[1]));}return best}
function operativeType(t){let s=String(t??'').toUpperCase().trim();return s==='ESEGUITO'||s==='OSSERVAZIONE_OPERATIVA'}
function calcMonth(name,rows){rows=rows.filter(r=>Object.values(r).some(v=>v!=null&&String(v).trim()!==''));let total=rows.length,operative=rows.filter(r=>operativeType(r.tipo_record)).length,methodological=total-operative;let levels=rows.map(r=>tpLevel(r.tp_massimo_raggiunto));let hit1=levels.filter(x=>x>=1).length,hit2=levels.filter(x=>x>=2).length,hit3=levels.filter(x=>x>=3).length;
 let mfes=rows.map(r=>parsePct(r.mfe_percent));let gross=mfes.reduce((a,v)=>a+(v==null?0:Math.abs(v)),0);let mean=c=>{let xs=rows.map(r=>parsePct(r[c])).filter(v=>v!=null);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null};
 let net=null,drawdown=null,seq=[];if(name!=='M1'){for(let i=0;i<rows.length;i++){let r=rows[i],lvl=levels[i],mfe=mfes[i],v=0;if(lvl>=3)v=mfe==null?0:Math.abs(mfe);else if(lvl>=2)v=0;else{let sig=[r.esito,r.stop_colpito,r.gestione_post_tp1].join(' ').toUpperCase();if(/SL|STOP|LOSS/.test(sig)){let sl=parsePct(r.stop_loss),mae=parsePct(r.mae_percent);if(sl!=null||mae!=null)v=-Math.abs(sl!=null?sl:mae)}}seq.push(v)}net=seq.reduce((a,b)=>a+b,0);let c=0,p=0,mdd=0;seq.forEach(v=>{c+=v;p=Math.max(p,c);mdd=Math.min(mdd,c-p)});drawdown=mdd}
 let prof=rows.filter(r=>operativeType(r.tipo_record)&&/PROFIT/.test(String(r.esito??'').toUpperCase())).length;let bi=-1,bv=-1;mfes.forEach((v,i)=>{if(v!=null&&Math.abs(v)>bv){bv=Math.abs(v);bi=i}});let br=bi>=0?rows[bi]:{};
 return {name,total,operative,methodological,hit1,hit2,hit3,gross:+gross.toFixed(2),net:net==null?null:+net.toFixed(2),drawdown:drawdown==null?null:+drawdown.toFixed(2),tp1:mean('tp1'),tp2:mean('tp2'),tp3:mean('tp3'),prof,best_asset:br.asset??'—',best_dir:br.direzione??'',best_mfe:bv>=0?+bv.toFixed(2):null,best_tp:br.tp_massimo_raggiunto??''};}
function sheetRows(wb,sheet){let ws=wb.Sheets[sheet];return ws?XLSX.utils.sheet_to_json(ws,{defval:null,raw:false}):[]}
function workbookToState(wb){let months={},rowsBy={};let diary=sheetRows(wb,'Diario');let m1=diary.filter(r=>String(r.ciclo_test??'').toUpperCase()==='M01');if(m1.length){months.M1=calcMonth('M1',m1);rowsBy.M1=m1}
 wb.SheetNames.filter(s=>/^M0?\d+$/.test(s)).forEach(s=>{let n=Number(s.replace(/\D/g,''));if(n===1)return;let key=`M${n}`,rows=sheetRows(wb,s);if(rows.length){months[key]=calcMonth(key,rows);rowsBy[key]=rows}});return {months,rows:rowsBy}}
function metric(k,v,cls='',sub=''){return `<div class="metric"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`}
function monthCard(m){return `<section class="card summary"><div class="monthHead"><h2>${m.name}</h2><span class="badge">${m.name==='M1'?'storico':'regole attuali'}</span></div><div class="metrics">
${metric('Osservazioni',m.total,'blue')}${metric('Operative',m.operative)}${metric('Direzione valida TP2+',rate(m.hit2,m.total),'good')}${metric('Esito positivo TP3+',rate(m.hit3,m.total),'warn')}
${metric('MFE lordo',pct(m.gross),'blue')}${metric('Netto metodologico',m.net==null?'non applicato':pct(m.net),m.net==null?'muted':'good')}
${metric('TP1 medio',pct(m.tp1))}${metric('TP2 medio',pct(m.tp2))}${metric('TP3 medio',pct(m.tp3))}${metric('Drawdown max',m.drawdown==null?'—':pct(m.drawdown),m.drawdown==null?'muted':'bad')}
</div><div class="note"><b>Best MFE:</b> ${esc(m.best_asset)} ${esc(m.best_dir)} · <span class="good">${pct(m.best_mfe)}</span> · ${esc(m.best_tp)}</div></section>`}
function overview(){let ms=Object.values(state.months).sort((a,b)=>Number(a.name.slice(1))-Number(b.name.slice(1)));let maxGross=Math.max(1,...ms.map(m=>m.gross||0)),maxNet=Math.max(1,...ms.map(m=>m.net||0));dash.innerHTML=ms.map(monthCard).join('')+`<section class="card wide"><h2>Confronto MFE lordo</h2><div class="bars">${ms.map((m,i)=>`<div class="barrow"><span>${m.name}</span><div class="track"><div class="fill ${i===0?'violet':''}" style="width:${100*m.gross/maxGross}%"></div></div><b>${pct(m.gross)}</b></div>`).join('')}</div></section><section class="card summary"><h2>Netto metodologico</h2><div class="bars">${ms.map(m=>`<div class="barrow"><span>${m.name}</span><div class="track"><div class="fill green" style="width:${m.net==null?0:100*m.net/maxNet}%"></div></div><b>${m.net==null?'n/a':pct(m.net)}</b></div>`).join('')}</div><div class="note">Regola: TP2 = BE · TP3+ = positivo · sotto TP2 + SL = negativo.</div></section>`}
function detail(name){let m=state.months[name],rows=state.rows[name]||[];dash.innerHTML=monthCard(m)+`<section class="card wide"><h2>Dettaglio ${name}</h2><div class="legend"><span><i class="dot" style="background:var(--green)"></i>TP3+</span><span><i class="dot" style="background:var(--amber)"></i>TP2 / BE</span><span><i class="dot" style="background:var(--red)"></i>&lt; TP2 / SL</span></div><div class="tableWrap" style="margin-top:12px"><table><thead><tr><th>Data</th><th>Asset</th><th>Dir.</th><th>Tipo</th><th>TP max</th><th>MFE</th><th>MAE</th><th>Esito</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.data)}</td><td><b>${esc(r.asset)}</b></td><td>${esc(r.direzione)}</td><td>${esc(r.tipo_record)}</td><td>${esc(r.tp_massimo_raggiunto)}</td><td>${esc(r.mfe_percent)}</td><td>${esc(r.mae_percent)}</td><td>${esc(r.esito)}</td></tr>`).join(''):`<tr><td colspan="8" class="muted">Il dettaglio riga per riga appare dopo il caricamento del diario.</td></tr>`}</tbody></table></div></section>`}
function renderTabs(){let names=Object.keys(state.months).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1)));tabs.innerHTML=`<button class="tab ${state.selected==='overview'?'active':''}" data-tab="overview">Panoramica</button>`+names.map(n=>`<button class="tab ${state.selected===n?'active':''}" data-tab="${n}">${n}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.selected=b.dataset.tab;render()}))}
function render(){renderTabs();state.selected==='overview'?overview():detail(state.selected)}
$('#resetBtn').addEventListener('click',()=>{state={months:structuredClone(DEMO),rows:{},selected:'overview',source:'demo'};statusEl.textContent='Dati demo ripristinati';render()});
$('#fileInput').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;if(typeof XLSX==='undefined'){statusEl.textContent='Parser Excel non caricato: serve connessione internet per aprire il file.';return}statusEl.textContent='Lettura in corso…';try{let ab=await f.arrayBuffer();let wb=XLSX.read(ab,{type:'array',cellDates:false});let res=workbookToState(wb);if(!Object.keys(res.months).length)throw new Error('Nessun foglio Mxx/Diario riconosciuto');state.months=res.months;state.rows=res.rows;state.selected='overview';state.source=f.name;statusEl.textContent=`Caricato: ${f.name}`;render()}catch(err){console.error(err);statusEl.textContent=`Errore: ${err.message}`}});
render();
</script>
</body></html>
